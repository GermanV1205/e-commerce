name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password_seguro
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:admin_password_seguro@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: secreto-solo-para-la-pipeline-de-ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-backend/package-lock.json

      - run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Aplicar migraciones
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  e2e:
    name: Playwright (flujos críticos)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password_seguro
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:admin_password_seguro@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: secreto-solo-para-la-pipeline-de-ci
      CORS_ORIGIN: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      STORAGE_DRIVER: local
      VITE_API_URL: http://localhost:3000/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e-commerce-backend/package-lock.json
            e-commerce-frontend/package-lock.json

      - name: Backend listo
        working-directory: e-commerce-backend
        run: |
          npm ci
          npm run db:generate
          npm run db:deploy
          npm run db:seed
          npm run build

      - name: Frontend + API + Playwright
        run: |
          cd e-commerce-backend
          npm run start:prod &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 2
            if [ "$i" -eq 40 ]; then echo "La API no respondió a tiempo"; exit 1; fi
          done
          cd ../e-commerce-frontend
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e


  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-frontend

    env:
      VITE_API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Build imagen de la API
        run: docker build -t ecommerce-api ./e-commerce-backend

      - name: Build imagen del frontend
        run: docker build -t ecommerce-web ./e-commerce-frontend
