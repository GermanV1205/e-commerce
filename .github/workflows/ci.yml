name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password_seguro
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:admin_password_seguro@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: secreto-solo-para-la-pipeline-de-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-backend/package-lock.json

      - run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Aplicar migraciones
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-frontend

    env:
      VITE_API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build imagen de la API
        run: docker build -t ecommerce-api ./e-commerce-backend

      - name: Build imagen del frontend
        run: docker build -t ecommerce-web ./e-commerce-frontend
