services:
  # 1. Base de Datos (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # 5433 en el host: el 5432 suele estar tomado por un PostgreSQL nativo.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # 2. Administrador visual de la base de datos
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecommerce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password_seguro}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  # 3. API (NestJS)
  api:
    build:
      context: ./e-commerce-backend
      dockerfile: Dockerfile
    container_name: ecommerce_api
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker se usa el nombre del servicio y el puerto interno 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin_password_seguro}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el archivo .env de la raiz}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      # Las imágenes subidas sobreviven al redeploy del contenedor
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # 4. Frontend (React + Vite servido por Nginx)
  web:
    build:
      context: ./e-commerce-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: ecommerce_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  uploads_data:

networks:
  ecommerce-network:
    driver: bridge
