services:
  # 1. Base de Datos (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # 5433 en el host: el 5432 suele estar tomado por un PostgreSQL nativo.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # 2. Administrador visual de la base de datos
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecommerce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password_seguro}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  # 3. API (NestJS)
  api:
    build:
      context: ./e-commerce-backend
      dockerfile: Dockerfile
    container_name: ecommerce_api
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker se usa el nombre del servicio y el puerto interno 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin_password_seguro}@postgres:5432/${POSTGRES_DB:-ecommerce}?schema=public
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el archivo .env de la raiz}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRANSFER_BANK_NAME: ${TRANSFER_BANK_NAME:-Banco Pichincha}
      TRANSFER_ACCOUNT_TYPE: ${TRANSFER_ACCOUNT_TYPE:-Ahorros}
      TRANSFER_ACCOUNT: ${TRANSFER_ACCOUNT:-2100123456}
      TRANSFER_HOLDER: ${TRANSFER_HOLDER:-Tienda de Ropa}
      TRANSFER_ID: ${TRANSFER_ID:-}
      TRANSFER_CURRENCY: ${TRANSFER_CURRENCY:-USD}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ecommerce}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/ecommerce}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-TiendaRopa <noreply@tiendaropa.local>}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "3000:3000"
    volumes:
      # Respaldo si STORAGE_DRIVER=local
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ecommerce-network

  # 4. Frontend (React + Vite servido por Nginx)
  web:
    build:
      context: ./e-commerce-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: ecommerce_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - ecommerce-network

  minio:
    image: minio/minio:latest
    container_name: ecommerce_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ecommerce-network

  minio-init:
    image: minio/mc:latest
    container_name: ecommerce_minio_init
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/$${S3_BUCKET:-ecommerce} || true;
      mc anonymous set download local/$${S3_BUCKET:-ecommerce};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ecommerce}
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  uploads_data:
  minio_data:

networks:
  ecommerce-network:
    driver: bridge
